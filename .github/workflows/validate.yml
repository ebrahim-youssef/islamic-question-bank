name: validate

on:
  push:
    # `release` is the branch consuming apps actually fetch, and it is a curated
    # subset of `main` rather than a copy of it — a category that is not complete
    # enough to play stays behind. So a merge into `release` can leave
    # data/manifest.json describing files that are not there, and the branch has
    # to be validated in its own right rather than trusted because its source was.
    branches: [main, release]
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/**"
  pull_request:
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install jsonschema

      - name: Validate data
        run: python scripts/validate.py
